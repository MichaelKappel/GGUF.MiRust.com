name: TinyRustLM NuGet CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify-nuget-sdk:
    name: Verify protected NuGet SDK
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify package boundary
        shell: pwsh
        run: eng/verify-package.ps1

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-nuget-packages
          path: artifacts/packages/*.nupkg

      - name: Upload NuGet audit reports
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-nuget-reports
          path: artifacts/reports/*.json
