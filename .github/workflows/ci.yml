name: TinyRustLM NuGet CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_deep_browser_smoke:
        description: Run the heavyweight Hugging Face conversion and P2P import browser execution smokes.
        required: false
        type: boolean
        default: false

jobs:
  verify-nuget-sdk:
    name: Verify protected NuGet SDK
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify TinyRustLM UI contract
        shell: pwsh
        run: eng/verify-tinyrustlm-ui.ps1 -RunBrowserSmoke

      - name: Verify TinyRustLM deep conversion and P2P UI contract
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_browser_smoke }}
        shell: pwsh
        run: eng/verify-tinyrustlm-ui.ps1 -Port 8185 -DebugPort 9452 -ReportOutput artifacts/reports/tinyrustlm-ui-deep-verification.json -BrowserSmokeModes hf-conversion-kit-safetensors-exec,hf-conversion-kit-review-exec,hf-conversion-kit-review-reject-exec,hf-conversion-kit-gguf-exec,hf-p2p-import-kit-exec

      - name: Verify TinyRustLM public root contract
        shell: pwsh
        run: eng/verify-tinyrustlm-public-root.ps1

      - name: Verify TinyRustLM deep UI report schema
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_deep_browser_smoke }}
        shell: pwsh
        env:
          TINYRUSTLM_UI_VERIFICATION_REPORT: artifacts/reports/tinyrustlm-ui-deep-verification.json
        run: dotnet test dotnet/tests/TinyRustLM.Package.Tests/TinyRustLM.Package.Tests.csproj -c Release --filter UiVerificationReportIsMachineReadableWhenPresent

      - name: Verify TinyRustLM UI report schema
        shell: pwsh
        env:
          TINYRUSTLM_UI_VERIFICATION_REPORT: artifacts/reports/tinyrustlm-ui-verification.json
          TINYRUSTLM_PUBLIC_ROOT_VERIFICATION_REPORT: artifacts/reports/tinyrustlm-public-root-verification.json
        run: dotnet test dotnet/tests/TinyRustLM.Package.Tests/TinyRustLM.Package.Tests.csproj -c Release --filter "UiVerificationReportIsMachineReadableWhenPresent|PublicRootVerificationReportIsMachineReadableWhenPresent"

      - name: Verify package boundary
        shell: pwsh
        run: eng/verify-package.ps1

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Upload NuGet audit reports
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-nuget-reports
          path: artifacts/reports/*.json

      - name: Upload TinyRustLM UI verification reports
        uses: actions/upload-artifact@v4
        with:
          name: tinyrustlm-ui-verification
          path: |
            artifacts/reports/tinyrustlm-ui-verification.json
            artifacts/reports/tinyrustlm-ui-deep-verification.json
            artifacts/reports/tinyrustlm-public-root-verification.json
            artifacts/reports/tinyrustlm-source-options-ui-smoke.json
            artifacts/reports/tinyrustlm-*-ui-smoke.json
            artifacts/reports/tinyrustlm-*-exec-smoke.json
            artifacts/reports/tinyrustlm-public-root-*-smoke.json
          if-no-files-found: error
